<!DOCTYPE html>
<html>
<head>
	<title>Inicio de sesión - MASSABE</title>
	<style>
		body {
			background-color: #F4F4F4;
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		.container {
			max-width: 400px;
			margin: 100px auto;
			background-color: white;
			padding: 20px;
			border-radius: 5px;
			box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
		}

		h1 {
			text-align: center;
			margin-bottom: 30px;
		}

		label {
			display: block;
			margin-bottom: 10px;
		}

		input[type="text"],
		input[type="password"] {
			width: 90%;
			padding: 10px;
			border: 1px solid #CCC;
			border-radius: 3px;
      margin-bottom: 1em;
		}

		input[type="submit"] {
			width: 50%;
			padding: 10px;
			background-color: #FFC107;
			border: none;
			border-radius: 3px;
			color: white;
			font-weight: bold;
			cursor: pointer;
      margin-left: 25%;
		}

		input[type="submit"]:hover {
			background-color: #FFA000;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Iniciar sesión</h1>
		<form action="/login" method="post">
			<label for="username">Nombre de usuario:</label>
			<input type="text" id="username" name="username" required>
			<label for="password">Contraseña:</label>
			<input type="password" id="password" name="password" required>
			<input type="submit" value="Iniciar sesión">
		</form>
	</div>
</body>
</html>
